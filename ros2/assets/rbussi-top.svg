<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240">
  <title>RBussi — plywood top view, front upwards</title>
  <desc>Plain plywood-coloured teaching sprite, without printed bus artwork. Body proportions 90 by 200 from top.dxf. Dark wheels, outline and front arrow improve visibility on the map.</desc>
  <!-- A white outer edge separates the dark outline from roads. -->
  <g fill="#282522" stroke="#ffffff" stroke-width="4">
    <rect x="61" y="130" width="17" height="43" rx="4"/>
    <rect x="162" y="130" width="17" height="43" rx="4"/>
  </g>
  <path d="M80 20 H160 L165 25 V215 L160 220 H80 L75 215 V25 Z" fill="#e8c58b" stroke="#ffffff" stroke-width="12" stroke-linejoin="round"/>
  <path d="M80 20 H160 L165 25 V215 L160 220 H80 L75 215 V25 Z" fill="#e8c58b" stroke="#493624" stroke-width="6" stroke-linejoin="round"/>
  <!-- Direction marker remains readable at the 45-pixel sprite size. -->
  <path d="M120 55 L99 84 H111 V112 H129 V84 H141 Z" fill="#493624"/>
</svg>
