[supervisord]
nodaemon=true
logfile=/tmp/supervisord.log
pidfile=/tmp/supervisord.pid
childlogdir=/tmp

[program:display]
command=/usr/bin/Xvfb :0 -screen 0 1280x800x24 -nolisten tcp
priority=10
autorestart=true

[program:window_manager]
command=/course/desktop/wait-display.sh /usr/bin/openbox
priority=20
autorestart=true

[program:vnc]
command=/course/desktop/wait-display.sh /usr/bin/x11vnc -display :0 -localhost -forever -shared -nopw -repeat -quiet
priority=30
autorestart=true

[program:browser]
command=/usr/bin/websockify --web=/usr/share/novnc 6080 localhost:5900
priority=40
autorestart=true

[program:simulator]
command=/course/desktop/wait-display.sh /course/desktop/start-sim.sh
priority=50
autorestart=true

[program:terminal]
command=/course/desktop/wait-display.sh /usr/bin/xterm -title "ROS terminal - keyboard control" -geometry 62x29+680+45 -fa "DejaVu Sans Mono" -fs 11 -bg white -fg "#142c3b" -e /course/desktop/start-terminal.sh
priority=60
autorestart=true
