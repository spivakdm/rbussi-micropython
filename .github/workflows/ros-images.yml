name: Build ROS classroom images
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  image:
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ros-kit-v0.1.0
      - name: Validate command and MQTT transport tests
        run: python3 -m unittest discover -s ros2/tests
      - name: Build the classroom image
        run: docker build -t rbussi-ros:0.1.0 ros2
      - name: Check ROS and MQTT imports
        run: docker run --rm rbussi-ros:0.1.0 python -c 'import rclpy; import paho.mqtt.client; from std_msgs.msg import String'
      - name: Export ready-to-load image
        run: |
          docker save rbussi-ros:0.1.0 | gzip -1 > rbussi-ros-0.1.0-${{ matrix.arch }}.tar.gz
          sha256sum rbussi-ros-0.1.0-${{ matrix.arch }}.tar.gz > rbussi-ros-0.1.0-${{ matrix.arch }}.tar.gz.sha256
      - name: Attach images to the classroom release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload ros-kit-v0.1.0 rbussi-ros-0.1.0-${{ matrix.arch }}.tar.gz rbussi-ros-0.1.0-${{ matrix.arch }}.tar.gz.sha256 --clobber
